name: aloca-ai
services:
  postgres:
    image: postgres:18-alpine
    container_name: aloca-ai-postgres
    restart: unless-stopped
    env_file: challenge/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hackathon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aloca_pgdata:/var/lib/postgresql
      - ./challenge/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  aloca_pgdata:
